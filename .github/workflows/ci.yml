name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none
          tools: cs2pr

      - uses: actions/checkout@v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v2
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer run-script phpstan -- --error-format=checkstyle | cs2pr

  merge-to-staging:
    if: (startsWith(github.head_ref, 'feature') || startsWith(github.head_ref, 'bugfix') || startsWith(github.head_ref, 'dependabot')) && !contains(github.event.pull_request.body, '[skip staging merge]')
    needs: [ phpstan ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Git config
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"

      - name: Merge branch to staging
        run: |
          git fetch --unshallow
          git checkout "$GITHUB_HEAD_REF"
          git pull
          git checkout staging
          git pull
          git merge --no-edit "$GITHUB_HEAD_REF"
          git push
